name: Deploy FreshFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FreshFront
        uses: actions/checkout@v4

      - name: Remove repository config.php
        run: |
          rm -f config.php

      - name: Create production config.php
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > config.php <<PHP
          <?php

          \$db_name = "mysql:host=sql206.infinityfree.com;port=3306;dbname=if0_42642077_shop_db;charset=utf8mb4";
          \$username = "if0_42642077";
          \$password = "${DB_PASSWORD}";

          \$conn = new PDO(\$db_name, \$username, \$password);
          \$conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);

          ?>
          PHP

      - name: Verify config.php
        run: |
          test -s config.php
          echo "config.php created successfully."

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: if0_42642077
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/shop_db.sql
            **/README.md